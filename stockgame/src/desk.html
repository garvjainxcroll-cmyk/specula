<title>Event Head Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*@THEME@*/

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .t { font: 600 15px/1.1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; }
.mark { width: 26px; height: 26px; }
.status { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 7px 10px; border-radius: var(--r-sm); font-weight: 500; position: relative; }
.tabs a:hover { color: var(--ink); background: var(--hover); }
.tabs a[aria-current="page"] { color: var(--gold-text); }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -2px; height: 2px; background: var(--gold); }
.secret-tag { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

.page { padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ctl { display: grid; grid-template-columns: 290px minmax(0, 1fr) 340px; gap: 20px; align-items: start; max-width: 1600px; margin: 0 auto; }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; min-width: 0; }
.panel.framed { border: 2px solid var(--gold); }
.h1 { font: 600 22px/1.2 var(--font-display); letter-spacing: 0.04em; }
.h2 { font: 600 13px/1.3 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* rounds rail */
.rounds { display: grid; gap: 4px; position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.rnd-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 6px 6px; }
.upd { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) 12px; gap: 8px; align-items: start; padding: 8px 6px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; color: inherit; }
.upd:hover { background: var(--hover); }
.upd[aria-current="true"] { background: var(--gold-wash); box-shadow: inset 2px 0 0 var(--gold); }
.upd .n { font: 600 12px/1.6 var(--font-mono); color: var(--muted); }
.upd .hl { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; border: 1.5px solid var(--line-strong); }
.dot.news { border-color: var(--gold); background: var(--gold-wash); }
.dot.priced { border-color: var(--gold); background: var(--gold); }
.dot.next { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-wash); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 6px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .dot { margin: 0; }

/* next step */
.next { display: grid; gap: 14px; }
.next .what { font: 600 26px/1.2 var(--font-display); letter-spacing: 0.03em; }
.next .btn:not(.small) { min-height: 52px; font-size: 14px; padding: 0 24px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--gold); width: 16px; height: 16px; margin: 0; }

/* update detail */
.story h2 { font: 600 26px/1.25 var(--font-text); }
.story .body { font: 400 17px/1.6 var(--font-text); display: grid; gap: 10px; max-width: 72ch; }
.story .body.clip p:nth-child(n+2) { display: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--gold-text); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; justify-self: start; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .r { text-align: right; }
.tbl .nw { white-space: nowrap; }
.effect td.why { font-family: var(--font-text); font-size: 15px; line-height: 1.4; min-width: 220px; }
.effect .mv { font-size: 16px; font-weight: 600; }
.done-line { font-size: 13px; color: var(--muted); }

/* code box */
.code-big { font: 600 34px/1.1 var(--font-mono); letter-spacing: 0.12em; color: var(--gold-text); }
.code-sm { font: 600 18px/1.2 var(--font-mono); letter-spacing: 0.1em; color: var(--ink); }
.timer { font: 600 46px/1 var(--font-mono); letter-spacing: 0.04em; }
.timer.low { color: var(--warn); }
.timer.over { color: var(--down); }
.board td, .board th { padding: 7px 6px; }
.confirm { border: 1px solid var(--warn); border-radius: var(--r-sm); padding: 10px; display: grid; gap: 8px; font-size: 13px; }

/* matrix */
.mx { font-size: 12px; }
.mx th, .mx td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
.mx thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; color: var(--muted); font-weight: 500; }
.mx th.r { text-align: right; }
.mx td.hd { max-width: 340px; overflow: hidden; text-overflow: ellipsis; position: sticky; left: 0; background: var(--panel); }
.mx td.c { text-align: right; min-width: 64px; font-weight: 600; color: var(--ink); border-left: 2px solid var(--panel); }
.mx tr.click { cursor: pointer; }
.mx tr.click:hover td.hd { color: var(--gold-text); }
.mx tr.done td.hd { color: var(--muted); }
.mx-wrap { overflow: auto; max-height: calc(100vh - 220px); }

/* small multiples */
.multi { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.mini svg { display: block; width: 100%; height: auto; }
.mstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 13px; }
.mstats > span { display: grid; gap: 1px; }
.mstats b { font-weight: 600; }

.empty { color: var(--muted); padding: 20px; text-align: center; }
textarea.input { min-height: 90px; font: 500 12px/1.4 var(--font-mono); word-break: break-all; resize: vertical; }
.voided { font-size: 13px; display: grid; gap: 4px; margin: 0; padding-left: 18px; }
.guide { font-family: var(--font-text); font-size: 17px; line-height: 1.6; max-width: 76ch; display: grid; gap: 12px; }
.guide ol, .guide ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.guide h3 { font: 600 14px/1.3 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 10px; }
.wide { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }

@media (max-width: 1280px) {
  .ctl { grid-template-columns: 270px minmax(0, 1fr); }
  .ctl > .side { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
}
@media (max-width: 820px) {
  .ctl { grid-template-columns: minmax(0, 1fr); }
  .rounds { position: static; max-height: 360px; }
  .tabs { margin-left: 0; }
  .next .what { font-size: 21px; }
}

/* ---------- big screen ---------- */
.screen { display: none; }
body.on-screen .desk { display: none; }
body.on-screen .screen { display: grid; }
body.on-screen::before { background: var(--night, #070302); }
.screen {
  height: 100vh; overflow: hidden; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2.2vh;
  padding-block: 3vh; padding-left: max(3vw, env(safe-area-inset-left, 0px)); padding-right: max(3vw, env(safe-area-inset-right, 0px));
}
.scr-top { display: flex; justify-content: space-between; align-items: center; gap: 2vw; flex-wrap: wrap; }
.scr-top .eyebrow { font-size: clamp(14px, 1.4vw, 24px); }
.scr-timer { display: flex; align-items: baseline; gap: 1vw; }
.scr-timer .timer { font-size: clamp(36px, 5vw, 88px); }
.scr-timer .lbl { font: 600 clamp(12px, 1.1vw, 20px)/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.scr-mid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 30vw); gap: 2.5vw; min-height: 0; }
.scr-news { border: 2px solid var(--gold); border-radius: var(--r-md); background: var(--panel); padding: 3vh 2.4vw; display: grid; gap: 1.6vh; align-content: start; overflow: hidden; }
.scr-news h2 { font: 600 clamp(24px, 2.6vw, 50px)/1.15 var(--font-text); }
.scr-news .body { font: 400 clamp(16px, 1.45vw, 27px)/1.5 var(--font-text); columns: 2 26ch; column-gap: 2.4vw; }
.scr-news .body p { margin: 0 0 1.2vh; break-inside: avoid; }
.scr-news ol { margin: 0; padding-left: 1.4em; display: grid; gap: 1.4vh; font: 500 clamp(18px, 1.9vw, 34px)/1.3 var(--font-text); }
.scr-code { border: 2px solid var(--gold); border-radius: var(--r-md); background: var(--panel); padding: 3vh 2vw; display: grid; gap: 1.6vh; align-content: center; text-align: center; }
.scr-code .code-big { font-size: clamp(30px, 3.6vw, 84px); white-space: nowrap; }
body.on-screen .toasts { display: none; }
.scr-code .what { font: 500 clamp(15px, 1.4vw, 26px)/1.35 var(--font-text); }
.scr-code .code-sm { font-size: clamp(18px, 1.8vw, 34px); }
.scr-code .eyebrow { font-size: clamp(12px, 1.1vw, 20px); }
.scr-board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1vw; }
.tile { border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 1.4vh 1vw; display: grid; gap: 0.4vh; background: var(--panel); }
.tile .tk { font: 600 clamp(14px, 1.3vw, 24px)/1.1 var(--font-ui); letter-spacing: 0.04em; }
.tile .px { font: 500 clamp(18px, 1.9vw, 36px)/1.1 var(--font-ui); }
.tile .ch { font: 500 clamp(13px, 1.15vw, 21px)/1.1 var(--font-ui); }
.tile.up { border-color: var(--up); }
.tile.down { border-color: var(--down); }
.movers { display: grid; gap: 1.4vh; }
.mover { display: grid; grid-template-columns: minmax(5em, auto) minmax(0, 1fr) auto; gap: 1.5vw; align-items: baseline; font: 500 clamp(18px, 2vw, 38px)/1.2 var(--font-ui); padding-bottom: 1vh; border-bottom: 1px solid var(--line); }
.mover .nm { font: 400 clamp(15px, 1.4vw, 26px)/1.2 var(--font-text); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaders { width: 100%; font: 500 clamp(18px, 1.9vw, 36px)/1.3 var(--font-ui); }
.leaders td, .leaders th { padding: 1.2vh 1vw; border-bottom: 1px solid var(--line); text-align: left; }
.leaders th { font: 600 clamp(12px, 1vw, 18px)/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.leaders .r { text-align: right; }
.leaders tr.hidden td { color: var(--line-strong); }
.exit { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); opacity: 0.15; z-index: 30; }
.exit:hover, .exit:focus-visible { opacity: 1; }
@media (max-width: 900px) {
  .screen { height: auto; min-height: 100vh; overflow: visible; }
  .scr-mid { grid-template-columns: minmax(0, 1fr); }
  .scr-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<script type="application/json" id="game">/*@PAYLOAD@*/</script>

<div class="desk">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" rx="6" fill="none" style="stroke: var(--gold)" stroke-width="2"/>
        <rect x="6.5" y="11" width="3" height="7" rx="0.8" style="fill: var(--gold)"/>
        <rect x="12.5" y="8" width="3" height="8" rx="0.8" style="fill: none; stroke: var(--gold)" stroke-width="1.2"/>
        <rect x="18.5" y="10" width="3" height="6" rx="0.8" style="fill: var(--gold)"/>
      </svg>
      <span class="t">Event Head Desk</span>
      <span class="secret-tag">Private · never project this window</span>
    </div>
    <div class="status" id="status"></div>
    <nav class="tabs" aria-label="Desk sections">
      <a href="#control" data-v="control">Control</a>
      <a href="#matrix" data-v="matrix">Impact matrix</a>
      <a href="#path" data-v="path">Price path</a>
      <a href="#teams" data-v="teams">Teams</a>
      <a href="#codes" data-v="codes">Codes</a>
      <a href="#guide" data-v="guide">Guide</a>
      <a href="#screen" data-v="screen">Big screen</a>
    </nav>
  </header>
  <div class="page" id="page"></div>
</div>

<div class="screen" id="screen" aria-live="polite"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
/*@ENGINE@*/
/*@CHART@*/

// One desk, two ways to run:
//  - as a single file (Claude artifact): the whole game is in this page; teams type codes.
//  - LIVE (the Netlify site): the game stays sealed on the server until the Event Head signs
//    in with the game key; every click changes the market for all teams at once.
//    /desk#screen (and /screen) is the public big screen and needs no sign-in.
const G = JSON.parse(document.getElementById('game').textContent);
const LIVE = !!G.live;
let ST = [], U = [], TK = [], MOVES = [], PATHS = [];
function setGame(g) {
  ST = g.stocks; U = g.updates; TK = ST.map((s) => s.t);
  MOVES = U.map((u) => u.moves.map((m) => [TK.indexOf(m.t), m.pct]));
  PATHS = pricePaths(ST, MOVES);
}
if (!LIVE) setGame(G);
const KEY = LIVE ? 'jaco-live:desk' : 'desk:' + G.id;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cls = (x) => (x > 0 ? 'up' : x < 0 ? 'down' : 'flat');
const arrow = (x) => (x > 0 ? '▲' : x < 0 ? '▼' : '');
const hhmm = (ms) => new Date(ms).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const code = (kind, i) => (LIVE ? '' : G.codes[kind][i - 1]);
const capital = () => (LIVE ? D.capital : G.capital);

// ---------- desk state ----------
// single file: kept in this browser (the big screen window reads the same copy).
// LIVE: the server's state; only the selected update and the grace are this desk's own.
const fresh = () => ({ a: 0, p: 0, log: [], mode: 'update', sel: 1, autoTimer: true, timer: { dur: 240000, endsAt: null, left: 240000 }, show: 'market', teams: [], reveal: 0, grace: 45, link: G.marketUrl || '' });
let storageOK = true;
function load() { try { const s = localStorage.getItem(KEY); return s ? { ...fresh(), ...JSON.parse(s) } : null; } catch { storageOK = false; return null; } }
function save() { if (LIVE) return; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch { storageOK = false; } }
let D = LIVE ? fresh() : load() || fresh();
let OFF = 0; // server clock minus this clock (LIVE)
const now = () => Date.now() + OFF;

const day = () => dayOf(D.a);
const stat = (k) => dayStats(PATHS[k], D.a, D.p);
const releasedAt = () => { const r = []; for (const e of D.log) if (e.kind === 'P') r[e.i] = e.at; return r; };
const logOf = (kind, i) => D.log.find((e) => e.kind === kind && e.i === i);

// ---------- talking to the server (LIVE) ----------
let gameKey = '';
try { gameKey = sessionStorage.getItem(KEY + ':key') || localStorage.getItem(KEY + ':key') || ''; } catch {}
let standingsRows = null, connected = true;
async function call(path, body) {
  const r = await fetch('/api/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  return r.json();
}
function setState(st) { if (st) D = { ...st, sel: D.sel || 1, grace: D.grace, link: location.origin }; }
async function admin(action, extra = {}, quiet = false) {
  let r;
  try { r = await call('admin', { key: gameKey, action, ...extra }); connected = true; }
  catch { connected = false; if (!quiet) toast('No connection', 'Check the Wi-Fi; nothing was changed.', true); render(); return { ok: false }; }
  if (r.now) OFF = r.now - Date.now();
  if (r.state) setState(r.state);
  if (r.standings) standingsRows = r.standings;
  if (!r.ok && !quiet) toast(r.error || 'That did not work', '', true);
  if (r.refused && r.code === 403 && action !== 'login') { gameKey = ''; forgetKey(); }
  return r;
}
function forgetKey() { try { sessionStorage.removeItem(KEY + ':key'); localStorage.removeItem(KEY + ':key'); } catch {} }

// ---------- the one-click steps ----------
function nextStep() {
  if (D.a > D.p) {
    const to = D.mode === 'round' ? D.a : D.p + 1;
    return { kind: 'P', from: D.p + 1, to };
  }
  if (D.a >= 45) return null;
  const to = D.mode === 'round' ? Math.min(45, Math.ceil((D.a + 1) / 5) * 5) : D.a + 1;
  return { kind: 'N', from: D.a + 1, to };
}
function stepLabel(s) {
  const span = s.from === s.to ? `update ${pad2(s.from)}` : `updates ${pad2(s.from)}–${pad2(s.to)}`;
  return s.kind === 'N' ? `Release news · ${span}` : `Move prices · ${span}`;
}
async function doStep(s) {
  if (LIVE) {
    const r = await admin('step', { kind: s.kind, from: s.from, to: s.to });
    if (r.ok) {
      D.sel = s.kind === 'N' ? s.from : Math.min(45, D.p + 1);
      toast(s.kind === 'N' ? 'News out' : 'Prices moved', s.kind === 'N' ? 'Every team sees the story now.' : 'Every team sees the new prices. The trading window is closed.');
    }
    render();
    return;
  }
  const at = Date.now(), batch = at;
  for (let i = s.from; i <= s.to; i++) {
    if (s.kind === 'N' && i === D.a + 1) { D.a = i; D.log.push({ kind: 'N', i, at, batch }); }
    if (s.kind === 'P' && i === D.p + 1 && i <= D.a) { D.p = i; D.log.push({ kind: 'P', i, at, batch }); }
  }
  D.sel = s.kind === 'N' ? s.from : Math.min(45, D.p + 1);
  if (s.kind === 'N' && D.autoTimer) startTimer(true);
  if (s.kind === 'P') stopTimer();
  save();
  const c = code(s.kind, s.to);
  toast(s.kind === 'N' ? `News out · code ${prettyCode(c)}` : `Prices moved · code ${prettyCode(c)}`, 'Show the big screen so teams can type the code.');
  render();
}
// Asking before moving prices while the trading window still runs.
function tryStep(s, box) {
  const left = timeLeft();
  if (s.kind === 'P' && D.timer.endsAt && left > 1000 && box) {
    box.innerHTML = `<div class="confirm"><span>The trading window still has ${fmtClock(left)} left. Move prices now and close it?</span><div class="row"><button class="btn small primary" type="button" id="stepYes">Move prices now</button><button class="btn small quiet" type="button" data-rerender>Wait</button></div></div>`;
    pendingStep = s;
    return;
  }
  doStep(s);
}
let pendingStep = null;
function undo() {
  if (LIVE) { admin('undo').then((r) => { if (r.ok) toast('News release undone', 'Teams no longer see that story.'); render(); }); return; }
  if (!D.log.length) return;
  const b = D.log[D.log.length - 1].batch;
  D.log = D.log.filter((e) => e.batch !== b);
  D.a = Math.max(0, ...D.log.filter((e) => e.kind === 'N').map((e) => e.i));
  D.p = Math.max(0, ...D.log.filter((e) => e.kind === 'P').map((e) => e.i));
  save(); render();
}
// The code on the big screen is always the latest released one of the last kind clicked,
// never one that has not been released (codes come from the counts, not from the log).
function onScreenCodes() {
  const last = D.log[D.log.length - 1];
  if (!last) return null;
  const main = { kind: last.kind, i: last.kind === 'N' ? D.a : D.p };
  if (!main.i) return null;
  const extra = main.kind === 'N' && D.p > 0 ? { kind: 'P', i: D.p } : main.kind === 'P' && D.a > D.p ? { kind: 'N', i: D.a } : null;
  const batch = last.jump ? [last] : D.log.filter((e) => e.batch === last.batch && e.kind === last.kind);
  return { main, extra, batch };
}
const when = (e) => (e.at ? hhmm(e.at) : 'a time set by hand');

// ---------- timer ----------
function timeLeft(t = D.timer) { return t.endsAt ? t.endsAt - now() : t.left; }
function startTimer(reset) { const t = D.timer; const left = reset ? t.dur : Math.max(0, timeLeft()); t.endsAt = Date.now() + left; t.left = left; chimed = false; }
function stopTimer() { const t = D.timer; if (t.endsAt) { t.left = Math.max(0, t.endsAt - Date.now()); t.endsAt = null; } }
function fmtClock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; }
let chimed = true;
function tick() {
  const t = view === 'screen' && LIVE ? PUB.state?.timer : D.timer;
  if (!t) return;
  const left = timeLeft(t);
  const running = !!t.endsAt;
  document.querySelectorAll('[data-timer]').forEach((el) => {
    el.textContent = fmtClock(left);
    el.classList.toggle('low', running && left <= 30000 && left > 0);
    el.classList.toggle('over', left <= 0);
  });
  document.querySelectorAll('[data-timer-lbl]').forEach((el) => { el.textContent = left <= 0 ? (LIVE ? 'Market closed' : 'Window closed') : running ? (LIVE ? 'Market open' : 'Trading window') : (LIVE ? 'Market closed' : 'Window paused'); });
  if (running && left <= 0 && !chimed) { chimed = true; beep(); }
  if (running && left > 0) chimed = false;
}
let actx;
function beep() {
  if (document.body.classList.contains('on-screen')) return;
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 660; g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, actx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.9);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.95);
  } catch {}
}
setInterval(tick, 250);
async function timerAct(op, extra = {}) {
  if (LIVE) { await admin('timer', { op, ...extra }); render(); return; }
  const t = D.timer;
  if (op === 'start') startTimer(true);
  if (op === 'pause') stopTimer();
  if (op === 'resume') startTimer(false);
  if (op === 'add') { if (t.endsAt) t.endsAt = Math.max(Date.now(), t.endsAt) + 30000; else t.left += 30000; chimed = false; }
  if (op === 'dur') { t.dur = extra.seconds * 1000; if (!t.endsAt) t.left = t.dur; }
  save(); render();
}

let view = 'control';
function route() {
  const h = (location.hash || '').slice(1);
  view = G.screenOnly ? 'screen' : ['control', 'matrix', 'path', 'teams', 'codes', 'guide', 'screen'].includes(h) ? h : 'control';
  if (LIVE && view === 'codes') view = 'control';
  document.body.classList.toggle('on-screen', view === 'screen');
  if (view === 'screen') $('#toasts').textContent = '';
  render();
  window.scrollTo(0, 0);
  if (LIVE) poke();
}
window.addEventListener('hashchange', route);
if (!LIVE) window.addEventListener('storage', (e) => { if (e.key === KEY) { D = load() || fresh(); render(); } });
if (LIVE) $('a[data-v="codes"]').remove();

function render() {
  if (view === 'screen') { renderScreen(); tick(); return; }
  if (LIVE && !U.length) { renderLogin(); return; }
  $('#status').innerHTML = `<span class="chip gold">Round ${pad2(day())} of 09</span><span class="chip">News ${pad2(D.a)}/45</span><span class="chip">Prices ${pad2(D.p)}/45</span>${LIVE ? `<span class="chip">${D.teams.length} team${D.teams.length === 1 ? '' : 's'}</span>${connected ? '' : '<span class="chip down">Reconnecting…</span>'}` : ''}`;

  const V = { control: vControl, matrix: vMatrix, path: vPath, teams: LIVE ? vTeamsLive : vTeams, codes: vCodes, guide: vGuide }[view];
  $('#page').innerHTML = V();
  after.forEach((f) => f()); after = [];

}

document.addEventListener('click', async (e) => {
  const t = e.target;
  const sel = t.closest('[data-sel]');
  if (sel) { D.sel = +sel.dataset.sel; save(); render(); return; }
  if (t.id === 'goNext') { const ns = nextStep(); if (ns) tryStep(ns, $('#stepBox')); return; }
  if (t.id === 'stepYes') { const s = pendingStep; pendingStep = null; if (s) doStep(s); return; }
  const one = t.closest('[data-one]');
  if (one && !one.disabled) { tryStep({ kind: one.dataset.one, from: D.sel, to: D.sel }, $('#oneBox')); return; }
  const md = t.closest('[data-mode]');
  if (md) { if (LIVE) await admin('settings', { mode: md.dataset.mode }); else { D.mode = md.dataset.mode; save(); } render(); return; }
  if (t.closest('[data-more]')) { const b = t.closest('[data-more]'); b.previousElementSibling.classList.remove('clip'); b.remove(); return; }
  const du = t.closest('[data-dur]');
  if (du) { timerAct('dur', { seconds: +du.dataset.dur * 60 }); return; }
  const tm = t.closest('[data-t]');
  if (tm) { timerAct(tm.dataset.t); return; }
  if (t.id === 'undo1') {
    const last = D.log[D.log.length - 1];
    const n = D.log.filter((x) => x.batch === last.batch && x.kind === last.kind).length;
    $('#undoBox').innerHTML = `<div class="confirm"><span>Undo ${last.kind === 'N' ? 'the news release' : 'the price move'} for ${n > 1 ? n + ' updates' : 'update ' + pad2(last.i)}? ${LIVE ? 'Teams have already seen it, so only undo a click made by mistake.' : 'Teams who already typed its code keep what it showed them, so only undo a click that no one has seen.'}</span><div class="row"><button class="btn small sell" type="button" id="undo2">Undo it</button><button class="btn small quiet" type="button" data-rerender>Keep it</button></div></div>`;
    return;
  }
  if (t.id === 'undo2') { undo(); if (!LIVE) toast('Last step undone', 'The desk and big screen are back one step.'); return; }
  if (t.closest('[data-rerender]')) { pendingStep = null; render(); return; }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'autoT') { if (LIVE) await admin('settings', { autoTimer: e.target.checked }); else { D.autoTimer = e.target.checked; save(); } }
  if (e.target.id === 'grace') { D.grace = Math.max(0, Math.min(600, Math.round(+e.target.value || 0))); save(); const st = $('#standings'); if (st) st.innerHTML = standingsHTML(); }

function vPath() {
  after.push(() => ST.forEach((s, k) => miniPath($('#mp' + k), PATHS[k], D.p)));
  return `<div class="wide">
    <div class="sec-head"><h1 class="h1">Price path</h1><span class="muted">Solid: prices so far. Dashed: what the rest of the script will do. Day lines every five updates.</span></div>

        <div class="mstats"><span><span class="label">Start</span><b class="num">${fmtPrice(st)}</b></span><span><span class="label">Now</span><b class="num">${fmtPrice(now)}</b> <span class="num ${cls(now - st)}">${fmtPct(now / st - 1, 1)}</span></span><span><span class="label">End of game</span><b class="num">${fmtPrice(end)}</b> <span class="num ${cls(end - st)}">${fmtPct(end / st - 1, 1)}</span></span></div>
        <div id="mp${k}"></div></div>`;
    }).join('')}</div>
    <div class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>After update</th>${TK.map((t) => `<th class="r">${t}</th>`).join('')}</tr></thead><tbody>
      ${Array.from({ length: 46 }, (_, p) => `<tr${p === D.p ? ' style="background:var(--gold-wash)"' : ''}><td class="num">${p ? pad2(p) : 'Start'}${p === D.p ? ' · now' : ''}</td>${ST.map((s, k) => `<td class="r num">${fmtPrice(PATHS[k][p])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div></div>`;
}
function miniPath(box, path, p) {
  const NS = 'http://www.w3.org/2000/svg', W = 300, H = 110, pl = 4, pr = 4, pt = 8, pb = 8;
  const lo = Math.min(...path) * 0.98, hi = Math.max(...path) * 1.02;
  const X = (i) => pl + (i / 45) * (W - pl - pr), Y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `Price after each of the 45 updates; ${p} applied so far`);
  const mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  for (let d = 5; d < 45; d += 5) mk('line', { x1: X(d), x2: X(d), y1: pt, y2: H - pb, style: 'stroke: var(--line)', 'stroke-width': 1 });
  mk('line', { x1: pl, x2: W - pr, y1: Y(path[0]), y2: Y(path[0]), style: 'stroke: var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 4', opacity: 0.6 });
  const seg = (a, b) => path.slice(a, b + 1).map((v, j) => (j ? 'L' : 'M') + X(a + j).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  if (p < 45) mk('path', { d: seg(p, 45), fill: 'none', style: 'stroke: var(--muted)', 'stroke-width': 1.5, 'stroke-dasharray': '3 3' });
  if (p > 0) mk('path', { d: seg(0, p), fill: 'none', style: 'stroke: var(--gold)', 'stroke-width': 2, 'stroke-linejoin': 'round' });
  mk('circle', { cx: X(p), cy: Y(path[p]), r: 4, style: 'fill: var(--gold); stroke: var(--panel)', 'stroke-width': 2 });
  box.appendChild(svg);
}

}

const PUB = { state: null, news: [] };
function screenData() {
  if (!LIVE) {
    const sc = onScreenCodes();

    return {

  }
  const st = PUB.state;
  if (!st) return null;
  const ids = st.last ? Array.from({ length: st.last.to - st.last.from + 1 }, (_, j) => st.last.from + j) : [];

    a: st.a, p: st.p, show: st.show, stocks: st.stocks, paths: pricePaths(st.stocks, st.moves), story: (i) => PUB.news.find((n) => n.i === i),

    join: { open: st.joinOpen, pin: st.pin, teams: st.teams, market: st.open },
  };
}

    const rows = sd.board, n = rows.length;
    const shown = rows.filter((r) => !r.hidden).length;
    left = `<div class="scr-news"><span class="eyebrow">Standings · valued after update ${pad2(sd.p)}</span>
      ${n ? `<table class="leaders"><thead><tr><th>Place</th><th>Team</th><th class="r">Account value</th><th class="r">Return</th></tr></thead><tbody>
      ${rows.map((t) => `<tr class="${t.hidden ? 'hidden' : ''}"><td class="num">${t.rank}</td><td>${t.hidden ? '· · ·' : esc(t.name)}</td><td class="r num">${t.hidden ? '' : fmtRs(t.value, { whole: true })}</td><td class="r num ${t.hidden ? '' : cls(t.ret)}">${t.hidden ? '' : fmtPct(t.ret)}</td></tr>`).join('')}
      </tbody></table>` : '<h2>Standings appear here once teams are in.</h2>'}</div>`;
    const leader = rows.find((r) => r.rank === 1);
    right = `<div class="scr-code"><span class="eyebrow">${over ? 'The closing bell' : 'Round ' + pad2(dayOf(sd.a))}</span><div class="what">${shown >= n && n && leader && !leader.hidden ? (over ? 'Congratulations to ' : 'Leading after update ' + pad2(sd.p) + ': ') + esc(leader.name) : 'Counting down from last place'}</div></div>`;
  } else if (!sd.last) {
    left = `<div class="scr-news"><span class="eyebrow">The opening bell</span><h2>Ten companies. Forty-five updates. Nine trading days.</h2>
      <div class="body">${LIVE
        ? `<p>Open <b>${esc(location.host)}</b> on a phone or laptop, type the PIN and your team name. You start with ${fmtRs((PUB.state?.capital || 0) * 100, { whole: true })}.</p><p>When news breaks it appears in your app and here. While the market is open, buy shares you think will rise, or sell and short the ones you think will fall.</p><p>When the Event Head moves prices, the market closes and your account updates by itself.</p>`
        : `<p>Open the Markets app${D.link ? ` at <b>${esc(D.link.replace(/^https?:\/\//, ''))}</b>` : ''} and name your team. You start with ${fmtRs(G.capital * 100, { whole: true })}.</p><p>When news breaks, a code appears here. Type it into <b>Enter code</b> to read the story, then buy, sell or short before the prices move.</p><p>When prices move, a new code appears. Type it and your app shows the new prices. Orders made at old prices after that do not count.</p>`}</div></div>`;
    right = LIVE ? `<div class="scr-code">${joinBox(true)}</div>` : `<div class="scr-code"><span class="eyebrow">Market code</span><div class="what">The first code appears when the first story breaks.</div></div>`;
  } else {
    const mainU = sd.story(sd.last.main);
    if (sd.last.kind === 'N') {
      const ids = sd.last.ids;
      left = !mainU ? '<div class="scr-news"><span class="eyebrow">Loading the news…</span></div>' : ids.length > 1
        ? `<div class="scr-news"><span class="eyebrow">Round ${pad2(mainU.round ?? mainU.r)} · ${ids.length} updates</span><ol start="${ids[0]}">${ids.map((i) => `<li>${esc(sd.story(i)?.head || '')}</li>`).join('')}</ol><div class="body" style="columns:auto"><p class="muted">Read the full stories in the app.</p></div></div>`
        : `<div class="scr-news"><span class="eyebrow">Update ${pad2(mainU.i)} · ${esc(mainU.cat)}</span><h2>${esc(mainU.head)}</h2><div class="body">${mainU.body.map((p) => `<p>${esc(p)}</p>`).join('')}</div></div>`;
    } else {
      const ids = sd.last.ids, from = Math.min(...ids) - 1, to = Math.max(...ids);
      const moved = sd.stocks.map((s, k) => ({ k, a: sd.paths[k][from], b: sd.paths[k][to] })).filter((m) => m.a !== m.b).sort((x, y) => (y.b / y.a) - (x.b / x.a));
      left = `<div class="scr-news"><span class="eyebrow">Prices moved · ${ids.length > 1 ? `updates ${pad2(from + 1)}–${pad2(to)}` : `update ${pad2(to)}`}</span>
        ${ids.length === 1 && mainU ? `<h2 style="font-size:clamp(20px,2.2vw,40px)">${esc(mainU.head)}</h2>` : ''}
        <div class="movers">${moved.map((m) => { const ch = m.b / m.a - 1; return `<div class="mover"><b>${sd.stocks[m.k].t}</b><span class="nm">${esc(sd.stocks[m.k].name)} · ${fmtPrice(m.a)} → ${fmtPrice(m.b)}</span><span class="num ${cls(ch)}">${arrow(ch)} ${fmtPct(ch)}</span></div>`; }).join('')}</div></div>`;
    }
    if (LIVE) right = `<div class="scr-code">${sd.join.open ? joinBox(false) + '<hr style="width:60%;border:0;border-top:1px solid var(--line);margin:1vh auto">' : ''}${marketBox()}</div>`;
    else {
      const sc = sd.codes;
      right = `<div class="scr-code"><span class="eyebrow">Enter this code</span><div class="code-big">${prettyCode(code(sc.main.kind, sc.main.i))}</div>
      <div class="what">${sc.main.kind === 'N' ? 'Opens the news. Prices have not moved yet.' : 'Moves your prices.'}</div>
      ${sc.extra ? `<div><div class="eyebrow" style="color:var(--muted)">Missed the last ${sc.extra.kind === 'P' ? 'price' : 'news'} code?</div><div class="code-sm">${prettyCode(code(sc.extra.kind, sc.extra.i))}</div></div>` : ''}</div>`;
    }
  }
  $('#screen').innerHTML = `
    <div class="scr-top"><span class="eyebrow">Round ${pad2(dayOf(sd.a))} of 09 · News ${pad2(sd.a)}/45 · Prices ${pad2(sd.p)}/45</span>
      <div class="scr-timer"><span class="lbl" data-timer-lbl></span><span class="timer" data-timer>00:00</span></div></div>
    <div class="scr-mid">${left}${right}</div>
    <div class="scr-board">${tiles}</div>
    ${G.screenOnly ? '' : '<a class="btn small quiet exit" href="#control">Exit big screen</a>'}`;
  fitStory();
}
// Fit the story to the panel so the price board below always shows: at each type size try two
// columns, then three, and only then go one step smaller. The type never goes below a size the
// back of a hall can read; a story still too long loses its last paragraphs (teams have the
// whole story in their app).
function fitStory() {
  const panel = $('#screen .scr-news'), body = panel && $('.leaders, .movers, ol, .body', panel);
  if (!body) return;
  const isBody = body.classList.contains('body');
  body.style.fontSize = ''; body.style.columns = '';
  const over = () => panel.scrollHeight > panel.clientHeight + 1;
  if (!over()) return;
  const floor = isBody ? Math.max(16, window.innerWidth / 100) : 12;
  for (let size = parseFloat(getComputedStyle(body).fontSize); size >= floor; size -= 0.5) {
    body.style.fontSize = size + 'px';
    for (const cols of isBody ? ['2 24ch', '3 18ch'] : ['']) {
      body.style.columns = cols;
      if (!over()) return;
    }
  }
  if (!isBody) return;
  body.style.fontSize = floor + 'px'; body.style.columns = '2 24ch';
  const note = document.createElement('p');
  note.className = 'muted';
  note.textContent = 'The full story is in your app.';
  body.appendChild(note);
  while (over() && body.children.length > 2) body.children[body.children.length - 2].remove();
}
window.addEventListener('resize', () => { if (view === 'screen') fitStory(); });

// ---------- keeping up with the server (LIVE) ----------
let lastScreen = '';
async function pollScreen() {
  try {
    const r = await call('poll');
    OFF = r.now - Date.now();
    PUB.state = r.state;
    const have = PUB.news.at(-1)?.i || 0;
    if (r.state && r.state.a > have) { const n = await call('news?from=' + have); PUB.news = PUB.news.concat(n.news); }
    if (r.state) PUB.news = PUB.news.filter((n) => n.i <= r.state.a);
    connected = true;
  } catch { connected = false; }
  const seen = JSON.stringify([PUB.state, PUB.news.length]);
  if (seen !== lastScreen) { lastScreen = seen; renderScreen(); }
  tick();
}
let lastDesk = '';
async function pollDesk() {
  if (!gameKey) return;
  const r = await admin('state', { withTeams: view === 'teams' }, true);
  if (r.refused && r.code === 403) { U = []; render(); return; }
  const seen = JSON.stringify([D, standingsRows, connected]);
  // re-render only when something changed, and never while the Event Head is typing
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (seen !== lastDesk && !typing && !$('.confirm')) { lastDesk = seen; render(); }
}
let pollTimer = null;
function poke() {
  clearTimeout(pollTimer);
  const run = async () => {
    if (view === 'screen') await pollScreen(); else if (U.length) await pollDesk();
    pollTimer = setTimeout(run, document.hidden ? 20000 : view === 'screen' ? 3000 : 4000);
  };
  run();
}

// ---------- toasts ----------
function toast(title, body, bad) {
  if (view === 'screen') return;
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  const b = document.createElement('b'); b.textContent = title;
  const s = document.createElement('span'); s.className = 'muted'; s.textContent = body || '';
  t.append(b, s);
  const box = $('#toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => t.remove(), 5200);
}

async function boot() {
  if (LIVE && gameKey && !G.screenOnly) {
    const r = await admin('login', {}, true);
    if (r.ok) { setGame(r.game); D.sel = Math.min(45, D.p + 1); } else { gameKey = ''; forgetKey(); }
  }
  route();
}
boot();
})();
</script>
